name: CI

on:
  push:
    branches: [ main, phase1-setup ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify component.yaml exists
        run: test -f component.yaml
      - name: Run lint (ruff)
        run: ruff check .
      - name: Run tests
        run: pytest -q
