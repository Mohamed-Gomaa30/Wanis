<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <meta name="description" content="وانيس – رفيقك الذكي بالصوت، مصمم لكبار السن">
    <title>وانيس – رفيق صوتي ذكي</title>
    <link href="app.css" rel="stylesheet">
</head>

<body>

    <div class="app-shell">

        <!-- ── Header ──────────────────────────────────── -->
        <header class="app-header">
            <div class="brand">
                <div class="logo-icon">🎙️</div>
                <h1>وانيس</h1>
            </div>
            <div class="status-badge">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">جاهز</span>
            </div>
        </header>

        <!-- ── Chat Area ───────────────────────────────── -->
        <div class="chat-area" id="chatArea">
            <div class="empty-state" id="emptyState">
                <div class="icon">🗣️</div>
                <p>اضغط في أي مكان للبدء</p>
            </div>
        </div>

        <!-- ── Bottom Controls ─────────────────────────── -->
        <div class="controls">
            <canvas class="visualizer" id="visualizer" height="48"></canvas>

            <button class="mic-btn" id="micBtn" aria-label="تسجيل">
                🎤
            </button>
            <span class="mic-label" id="micLabel">اضغط للتحدث</span>
        </div>

    </div>

    <script src="app.js"></script>
</body>

</html>
