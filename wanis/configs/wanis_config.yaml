# Wanis Configuration
# ==================
# Centralized configuration for all Wanis components.
# Used by: voice pipeline, agent, services, hardware modules.
#
# Sections:
# - audio: Audio I/O settings (sample rate, buffer size)
# - stt: Speech-to-Text settings (model, language)
# - tts: Text-to-Speech settings (model, speed)
# - vad: Voice Activity Detection settings (threshold, silence detection)
# - sentence_buffer: Sentence boundary detection for streaming
# - websocket: WebSocket server settings (for hybrid mode)
# - agent: LLM agent settings (model, temperature)
# - services: External services (notifications, vitals)
# - hardware: Hardware settings (Pi-specific: sensors, GPIO)
# - logging: Logging configuration

# Audio Settings
audio:
  sample_rate: 16000
  channels: 1
  chunk_size_ms: 30        # 512 samples at 16kHz = 32ms (Silero VAD requirement)
  buffer_seconds: 30       # Circular buffer size for capture

# Speech-to-Text Settings
stt:
  model_id: "NAMAA-Space/EgypTalk-ASR-v2"   # HuggingFace model for Egyptian Arabic
  local_model_path: "models/stt_ar_fastconformer_hybrid_large_pcd_v1.0.nemo"
  language: "ar-EG"
  max_retries: 3
  retry_delay: 0.1

# Text-to-Speech Settings
tts:
  model_id: "OmarSamir/EGTTS-V0.1"          # HuggingFace model for Arabic TTS
  language: "ar"
  speed: 0.85                               # Slower for elderly (1.0 = normal)
  sample_rate: 16000

# Voice Activity Detection Settings
vad:
  model: "silero_vad"
  threshold: 0.5                            # Speech probability threshold
  min_speech_ms: 250                        # Minimum speech duration to consider valid
  min_silence_ms: 2000 # Silence duration to mark speech end (2 seconds for real-time transcription)

# Sentence Buffer Settings (for streaming LLM output to TTS)
sentence_buffer:
  min_length: 10                            # Minimum chars before yielding sentence

# WebSocket Settings (for hybrid mode)
websocket:
  host: "0.0.0.0"
  port: 8000
  max_message_size_mb: 10
  reconnect_interval: 5.0

# Agent Settings (LLM)
agent:
  model: "gemini-2.0-flash"
  temperature: 0.7
  max_tokens: 512
  max_history_turns: 3

# Services Settings
services:
  notification:
    enabled: true
    telegram_bot_token: ""
    telegram_chat_id: ""

# Hardware Settings (Pi only)
hardware:
  vitals_sensor:
    i2c_bus: 1
    i2c_address: "0x57"
  fall_detector:
    gpio_pin: 17
    bounce_time: 1000
  pill_dispenser:
    motor_pins: [18, 19, 20, 21]
    slots: 4

# Logging
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
