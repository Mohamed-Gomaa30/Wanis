# Speech-to-Text.yaml
# Advanced configuration for multi-model fine-tuning

# Model configurations
models:
  language: "arabic"
  task: "transcribe"
  apply_spec_augment: false
  freeze_encoder: false
  freeze_feature_encoder: false

  baseline:
    - "openai/whisper-tiny"
    - "openai/whisper-small"
    - "openai/whisper-medium"
    - "openai/whisper-large"
    - "nvidia/stt_ar_fastconformer_hybrid_large_pcd_v1.0"
    - "speechbrain/asr-wav2vec2-commonvoice-14-ar"
    - "omarxadel/hubert-large-arabic-egyptian"
  # baseline:
  #   whisper_tiny: 
  #     name: "openai/whisper-tiny"
  #     type: "whisper"
  #   whisper_small:
  #     name: "openai/whisper-small" 
  #     type: "whisper"
  #   whisper_medium:
  #     name: "openai/whisper-medium"
  #     type: "whisper"
  #   nvidia_conformer:
  #     name: "nvidia/stt_ar_fastconformer_hybrid_large_pcd_v1.0"
  #     type: "conformer"
  #   speechbrain_wav2vec2:
  #     name: "speechbrain/asr-wav2vec2-commonvoice-14-ar"
  #     type: "wav2vec2"
  #   hubert_arabic:
  #     name: "omarxadel/hubert-large-arabic-egyptian"
  #     type: "hubert"

# Dataset configurations
datasets:
  egyptian_asr:
    name: "Egyptian ASR MGB-3"
    path: "MohamedGomaa30/Egyptian-ASR-MGB-3"
    train_split: "train"
    eval_split: "eval"  
    test_split: "test"
    audio_col: "audio"
    text_col: "sentence"
    language: "arabic"
    dialect: "egyptian"

  arabic_egy:
    name: "Arabic Egyptian Cleaned"
    path: "MAdel121/arabic-egy-cleaned"
    train_split: "train"
    eval_split: "validation"
    test_split: "test"
    audio_col: "audio"
    text_col: "text"
    language: "arabic"
    dialect: "egyptian"

# Training hyperparameters
training:
  # Basic training parameters
  num_train_epochs: 3 #  for (arabic_egy, A100) , 3 for (egyptian_asr,t4)
  batch_size: 32 # for (arabic_egy, A100) , 8 for (egyptian_asr,t4)
  gradient_accumulation_steps: 1 # for (arabic_egy, A100) , 2 for (egyptian_asr,t4)
  learning_rate: 0.00001
  warmup_steps: 1000 # for (arabic_egy, A100) , 500 for (egyptian_asr,t4)
  max_steps: -1
  
  # Evaluation and checkpointing
  eval_strategy: "epoch"
  save_strategy: "epoch" 
  
  eval_steps: none 
  save_steps: none
 
  logging_steps: 50 # for (arabic_egy, A100) , 100 for (egyptian_asr,t4)
  save_total_limit: 2
  
  # Performance optimization
  fp16: false # for (arabic_egy, A100) , true  for (egyptian_asr,t4)
  bf16: true # for (arabic_egy, A100) , false  for (egyptian_as
  tf32: true # for (arabic_egy, A100) , false  for (egyptian_asr,t4)
 
  group_by_length: true
  gradient_checkpointing: false # for (arabic_egy, A100) , true  for (egyptian_asr,t4)
  
  # Generation settings
  predict_with_generate: true
  generation_max_length: 225
  generation_num_beams: 1

  # push to hub settings
  push_to_hub: True
  hub_private_repo: True

# Data preprocessing settings
data:
  # Audio filtering
  max_duration_in_seconds: 30.0
  min_duration_in_seconds: 0.5
  
  # Dataset sizing
  num_train_samples: null  
  num_eval_samples: null   
  
  # Processing settings
  preprocessing_num_workers: 16 # for (arabic_egy, A100) , 1 for (egyptian_asr,t4)
  do_lower_case: false
  
  # Audio processing
  sampling_rate: 16000
  return_attention_mask: true

# Evaluation configuration
evaluation:
  # Metrics to compute
  metrics: ["wer", "cer", "accuracy"]
  
  # Hardware settings
  device: "cuda"
  
  # Evaluation limits
  do_samples: none 
  max_samples: 500 
  batch_size: 16
  
  # Output settings
  save_predictions: true
  output_dir: "./evaluation_results"

# Output configuration
output:
  base_dir: "./fine_tuned_models"
  save_format: ["pytorch", "safetensors"]
  push_to_hub: Ture
  hub_model_id: "your-username/whisper-arabic-egyptian"

# Experiment tracking
logging:
  report_to: "tensorboard"
  logging_dir: "./logs"
  experiment_name: "arabic_asr_baseline_comparison"