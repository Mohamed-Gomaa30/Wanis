# speechbrain_config.yaml
# SpeechBrain-specific configuration for fine-tuning

# Model configurations
models:
  language: "arabic"
  task: "transcribe"
  apply_spec_augment: false
  freeze_encoder: false
  freeze_feature_encoder: false

  baseline:
    - "speechbrain/asr-wav2vec2-commonvoice-14-ar"

# Dataset configurations
datasets:
  egyptian_asr:
    name: "Egyptian ASR MGB-3"
    path: "MohamedGomaa30/Egyptian-ASR-MGB-3"
    train_split: "train"
    eval_split: "eval"  
    test_split: "test"
    audio_col: "audio"
    text_col: "sentence"
    language: "arabic"
    dialect: "egyptian"

  arabic_egy:
    name: "Arabic Egyptian Cleaned"
    path: "MAdel121/arabic-egy-cleaned"
    train_split: "train"
    eval_split: "validation"
    test_split: "test"
    audio_col: "audio"
    text_col: "text"
    language: "arabic"
    dialect: "egyptian"

# Training hyperparameters optimized for SpeechBrain
training:
  # Basic training parameters
  num_train_epochs: 10
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 3e-5
  warmup_steps: 1000
  max_steps: -1
  
  # Evaluation and checkpointing
  eval_strategy: "epoch"
  save_strategy: "epoch" 
  logging_steps: 100
  save_total_limit: 2
  
  # Performance optimization for SpeechBrain
  fp16: true
  bf16: false
  tf32: false
  group_by_length: true
  gradient_checkpointing: true
  
  # Generation settings for SpeechBrain
  predict_with_generate: true
  generation_max_length: 200
  generation_num_beams: 1

  # push to hub settings
  push_to_hub: true
  hub_private_repo: true

  # SpeechBrain-specific configurations
  speechbrain_specific:
    freeze_feature_extractor: false
    ctc_loss_reduction: "mean"
    ctc_zero_infinity: true
    weight_decay: 0.005
    max_grad_norm: 1.0

# Data preprocessing settings for SpeechBrain
data:
  # Audio filtering
  max_duration_in_seconds: 20.0
  min_duration_in_seconds: 1.0
  
  # Dataset sizing
  num_train_samples: null  
  num_eval_samples: null   
  
  # Processing settings
  preprocessing_num_workers: 16
  do_lower_case: false
  
  # Audio processing (SpeechBrain wav2vec2 uses 16kHz)
  sampling_rate: 16000
  return_attention_mask: true

# Evaluation configuration
evaluation:
  metrics: ["wer", "cer", "accuracy"]
  device: "cuda"
  do_samples: false 
  max_samples: 500 
  batch_size: 4
  save_predictions: true
  output_dir: "./evaluation_results/speechbrain"

# Output configuration
output:
  base_dir: "./fine_tuned_models/speechbrain"
  save_format: ["pytorch"]
  push_to_hub: true
  hub_model_id: "your-username/speechbrain-arabic-egyptian"

# Experiment tracking
logging:
  report_to: "tensorboard"
  logging_dir: "./logs/speechbrain"
  experiment_name: "speechbrain_arabic_finetuning"